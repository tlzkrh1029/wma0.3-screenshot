name: Fetch daily closes

# Daily 1D closes for every coin in data/tickers.json (CRYPTOCAP + CRYPTO USD tickers), one file per ticker in
# data/daily. The other 19 timeframes are rebuilt from these closes, matching TradingView's own bars.
# Most days fetch only the last 60 bars and merge them in (a new ticker gets its whole history); the Sunday run
# fetches every ticker's whole history again, picking up any older revisions.
# Then the screener site is rebuilt from data/daily and deployed to GitHub Pages (Settings -> Pages -> Source:
# GitHub Actions must be on). The run fails when the data has stopped moving (scripts/check-fresh.mjs), so the
# failure notification reaches the owner; the page also shows a warning when the last fetch is over 36 hours old.
# TradingView is read without a login (no TV_SESSIONID secrets).
# GitHub disables a public repo's schedule after 60 days without activity. The daily data commit is the only
# activity this repo relies on: never add dummy/keepalive commits or automated "enable workflow" API calls
# (GitHub took down keepalive-workflow for circumventing that policy). If the schedule is ever disabled,
# re-enable it by hand in the Actions tab.
on:
  schedule:
    - cron: '15 0 * * *'   # 00:15 UTC = 09:15 KST, after the daily candle closes
  workflow_dispatch:
    inputs:
      mode:
        description: 'recent (last 60 bars) or full (whole history)'
        type: choice
        options: [recent, full]
        default: recent
  push:
    branches: ['claude/**']
    paths:
      - 'data/tickers.json'
      - 'data/universe.json'
      - 'data/mapping-log.json'
      - 'dashboard/screener.html'
      - 'dashboard/engine.js'
      - 'scripts/build-site.mjs'
      - '.github/workflows/fetch-daily.yml'

permissions:
  contents: write

concurrency:
  group: fetch-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      site: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode="${{ inputs.mode }}"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; then mode=full
          else mode=recent; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"

      - name: Fetch daily closes
        env:
          TICKERS_FILE: data/tickers.json
          OUT_DIR: data/daily
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/fetch-tv.mjs

      # Each ticker file is written only when its fetch succeeds, so even a failed run leaves consistent files.
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data/daily
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -q -m "Update daily closes ($(date -u +%F), ${{ steps.mode.outputs.mode }})"
            # the weekly universe refresh or a merge may push in between; retry a few times, then fail loudly
            for i in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              git rebase --abort 2>/dev/null || true
              if [ "$i" = 3 ]; then echo "::error::could not push the daily closes"; exit 1; fi
              sleep $((i * 15))
            done
          fi

      - name: Build site
        id: site
        if: ${{ !cancelled() }}
        run: |
          node scripts/build-site.mjs dist/site
          echo "built=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && steps.site.outputs.built == 'yes' }}
        with:
          path: dist/site

      # last, so the site is still built and deployed; a failure here fails the run and notifies the owner
      - name: Check that the data is fresh
        if: ${{ !cancelled() }}
        run: node scripts/check-fresh.mjs

  deploy:
    needs: fetch
    if: ${{ !cancelled() && needs.fetch.outputs.site == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
