name: Capture market-cap charts

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: Number of top coins by market cap to capture
        default: '2'
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/**'
      - '.github/workflows/capture.yml'

permissions:
  contents: write

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        env:
          TOP_N: ${{ inputs.top_n || '2' }}
        run: npm run capture

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if git diff --cached --quiet; then
            echo "No new screenshots"
          else
            git commit -m "Add market-cap chart screenshots ($(date -u +%F))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
