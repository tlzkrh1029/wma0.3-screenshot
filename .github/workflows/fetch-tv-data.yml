name: Fetch TradingView history

# TradingView's own bars for the six reference tickers in all 20 timeframes (data/tv-history.json), used to check
# the screener's rebuilt timeframes against TradingView. Without a login TradingView refuses custom resolutions
# (2D, 3W, 2M, ...: series_error custom_resolution), and this repo no longer logs in, so a run fails until that
# changes. data/tv-history.json keeps the last logged-in fetch (2026-10-05). The daily screener is not affected:
# it fetches 1D only and rebuilds the other timeframes itself. Manual runs only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-tv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Fetch history
        run: node scripts/fetch-tv.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update TradingView history ($(date -u +%F))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
